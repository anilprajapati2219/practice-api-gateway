# NOT applied by Jenkins for the DEV pipeline anymore. The Jenkinsfile now
# regenerates this same Secret at deploy time from Jenkins Credentials
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET, AZURE_REDIRECT_URI,
# JWT_SECRET) via `kubectl create secret ... --dry-run=client | kubectl apply`,
# so the real values live only in Jenkins, never in git. See Jenkinsfile's
# "Deploy to DEV" stage.
#
# This file is kept only for local/manual testing — e.g. `kubectl apply -f`
# this directly against a scratch namespace when you don't want to go
# through Jenkins. If you do that, remember AZURE_CLIENT_SECRET below is a
# placeholder, and JWT_SECRET is a throwaway DEV value
# (generate a real one per real environment: openssl rand -base64 32).
apiVersion: v1
kind: Secret
metadata:
  name: practice-dashboard-gateway-secret
  namespace: practice-dashboard-gateway
type: Opaque
stringData:
  AZURE_TENANT_ID: "5e45e2ef-d6aa-4ad1-aaca-a7187394a753"
  AZURE_CLIENT_ID: "ce00c467-f4c4-469f-a695-620d11073fde"
  # Provided by IT once the SPA -> Web app registration change is done.
  # Leave blank in git — see warning above.
  AZURE_CLIENT_SECRET: ""
  # Must match EXACTLY (including trailing slash) the redirect URI
  # registered in Azure under the "Web" platform, and what Angular's
  # app-config.json AZURE_AD.REDIRECT_URI sends.
  AZURE_REDIRECT_URI: "https://practice-dashboard-dev.sandhata.com/"
  # DEV-ONLY placeholder — replace with a real random value per environment.
  JWT_SECRET: "Q0hBTkdFX01FX0xPQ0FMX0RFVl9KV1RfU0VDUkVUXzMyQllURVNfTUlO"