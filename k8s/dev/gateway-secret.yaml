# NOT applied by Jenkins for the DEV pipeline anymore. The Jenkinsfile now
# regenerates this same Secret at deploy time from Jenkins Credentials
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET,
# GATEWAY_AZURE_REDIRECT_URIS, JWT_SECRET) via
# `kubectl create secret ... --dry-run=client | kubectl apply`, so the real
# values live only in Jenkins, never in git. See Jenkinsfile's
# "Deploy to DEV" stage.
#
# NOTE: the Jenkins credential is GATEWAY_AZURE_REDIRECT_URIS, deliberately
# NOT the same ID as integration-dashboard-service's AZURE_REDIRECT_URI
# credential (that one holds a single URL for Angular's app-config.json;
# this one holds a comma-separated list). The k8s Secret KEY below is still
# called AZURE_REDIRECT_URI though — that's just the pod env var name the
# gateway's application.yml reads, unrelated to the Jenkins credential ID.
#
# This file is kept only for local/manual testing — e.g. `kubectl apply -f`
# this directly against a scratch namespace when you don't want to go
# through Jenkins. If you do that, remember AZURE_CLIENT_SECRET below is a
# placeholder, and JWT_SECRET is a throwaway DEV value
# (generate a real one per real environment: openssl rand -base64 32).
apiVersion: v1
kind: Secret
metadata:
  name: practice-dashboard-gateway-secret
  namespace: practice-dashboard-gateway
type: Opaque
stringData:
  AZURE_TENANT_ID: "5e45e2ef-d6aa-4ad1-aaca-a7187394a753"
  AZURE_CLIENT_ID: "ce00c467-f4c4-469f-a695-620d11073fde"
  # Provided by IT once the SPA -> Web app registration change is done.
  # Leave blank in git — see warning above.
  AZURE_CLIENT_SECRET: ""
  # Comma-separated — one entry per frontend domain sharing this gateway.
  # Each must match EXACTLY what's registered in Azure under the "Web"
  # platform AND what that frontend's own AZURE_AD.REDIRECT_URI /
  # VITE_AZURE_REDIRECT_URI sends — including whether there's a trailing
  # slash or not. Azure does a literal string match, not a normalized one.
  # The Angular entry below has NO trailing slash because that's what's
  # actually registered and working in Azure today — confirmed with IT,
  # not assumed. The FIRST entry is the fallback used when a caller
  # doesn't send its own redirectUri (Angular does this today) — keep
  # Angular's URI first if you're relying on that fallback.
  AZURE_REDIRECT_URI: "https://practice-dashboard-dev.sandhata.com,https://new-practice-dashboard-dev.sandhata.com"
  # DEV-ONLY placeholder — replace with a real random value per environment.
  JWT_SECRET: "Q0hBTkdFX01FX0xPQ0FMX0RFVl9KV1RfU0VDUkVUXzMyQllURVNfTUlO"